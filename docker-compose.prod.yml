services:
  listly:
    build:
      context: .
    image: listly:latest
    container_name: listly
    networks:
      - dokploy-network
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000" 
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - listly-data:/data

volumes:
  listly-data:

networks:
  dokploy-network:
    external: true

services:
  listly:
    build:
      context: .
    image: listly:latest
    container_name: listly
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-app.rule=Host(`listly.aperezg.dev`)
      - traefik.http.routers.frontend-app.entrypoints=web
      - traefik.http.services.frontend-app.loadbalancer.server.port=3000
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000" 
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - listly-data:/data

volumes:
  listly-data:

networks:
  dokploy-network:
    external: true

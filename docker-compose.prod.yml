services:
  app:
    image: listly:latest
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listly.rule=Host(`listly.aperezg.dev`)"
      - "traefik.http.routers.listly.entrypoints=websecure"
      - "traefik.http.routers.listly.tls=true"
      - "traefik.http.routers.listly.tls.certresolver=letsencrypt"
      - "traefik.http.services.listly.loadbalancer.server.port=3001"

networks:
  dokploy-network:
    external: true
volumes:
  listly-data:
    external: true
    name: listly-app-gmrury_listly-data
